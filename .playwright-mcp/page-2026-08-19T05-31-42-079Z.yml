              - listitem [ref=f7e338]:
                - generic [ref=f7e339]: "1."
                - generic [ref=f7e340]: Mark out the slab and check it for square by measuring both diagonals.
              - listitem [ref=f7e341]:
                - generic [ref=f7e342]: "2."
                - generic [ref=f7e343]: Call for utility locates before you dig.
              - listitem [ref=f7e344]:
                - generic [ref=f7e345]: "3."
                - generic [ref=f7e346]: Excavate to slab thickness plus base depth.
              - listitem [ref=f7e347]:
                - generic [ref=f7e348]: "4."
                - generic [ref=f7e349]: Add and compact the gravel base in layers.
              - listitem [ref=f7e350]:
                - generic [ref=f7e351]: "5."
                - generic [ref=f7e352]: Build and brace the forms, setting the slope for drainage.
              - listitem [ref=f7e353]:
                - generic [ref=f7e354]: "6."
                - generic [ref=f7e355]: Place reinforcement on chairs so it sits mid-slab.
              - listitem [ref=f7e356]:
                - generic [ref=f7e357]: "7."
                - generic [ref=f7e358]: Re-check dimensions, depth, and slope before the concrete arrives.
              - listitem [ref=f7e359]:
                - generic [ref=f7e360]: "8."
                - generic [ref=f7e361]: Place the concrete and screed it level with the forms.
              - listitem [ref=f7e362]:
                - generic [ref=f7e363]: "9."
                - generic [ref=f7e364]: Float, edge, and finish once the bleed water is gone.
              - listitem [ref=f7e365]:
                - generic [ref=f7e366]: "10."
                - generic [ref=f7e367]: Cure it — keep it damp or covered for several days.
              - listitem [ref=f7e368]:
                - generic [ref=f7e369]: "11."
                - generic [ref=f7e370]: Strip the forms and backfill the edges.
