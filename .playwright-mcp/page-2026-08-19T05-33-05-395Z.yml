                - generic [ref=f11e262]: Excavate to slab thickness plus base depth.
              - listitem [ref=f11e263]:
                - generic [ref=f11e264]: "4."
                - generic [ref=f11e265]: Add and compact the gravel base in layers.
              - listitem [ref=f11e266]:
                - generic [ref=f11e267]: "5."
                - generic [ref=f11e268]: Build and brace the forms, setting the slope for drainage.
              - listitem [ref=f11e269]:
                - generic [ref=f11e270]: "6."
                - generic [ref=f11e271]: Place reinforcement on chairs so it sits mid-slab.
              - listitem [ref=f11e272]:
                - generic [ref=f11e273]: "7."
                - generic [ref=f11e274]: Re-check dimensions, depth, and slope before the concrete arrives.
              - listitem [ref=f11e275]:
                - generic [ref=f11e276]: "8."
                - generic [ref=f11e277]: Place the concrete and screed it level with the forms.
              - listitem [ref=f11e278]:
                - generic [ref=f11e279]: "9."
                - generic [ref=f11e280]: Float, edge, and finish once the bleed water is gone.
              - listitem [ref=f11e281]:
                - generic [ref=f11e282]: "10."
                - generic [ref=f11e283]: Cure it — keep it damp or covered for several days.
              - listitem [ref=f11e284]:
                - generic [ref=f11e285]: "11."
                - generic [ref=f11e286]: Strip the forms and backfill the edges.
