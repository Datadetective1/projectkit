                - generic [ref=f6e301]: "1"
                - generic [ref=f6e302]: Mark out the slab and check it for square by measuring both diagonals.
              - listitem [ref=f6e303]:
                - generic [ref=f6e304]: "2"
                - generic [ref=f6e305]: Call for utility locates before you dig.
