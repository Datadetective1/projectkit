                - generic [ref=f6e308]: Excavate to slab thickness plus base depth.
              - listitem [ref=f6e309]:
                - generic [ref=f6e310]: "4"
                - generic [ref=f6e311]: Add and compact the gravel base in layers.
              - listitem [ref=f6e312]:
                - generic [ref=f6e313]: "5"
                - generic [ref=f6e314]: Build and brace the forms, setting the slope for drainage.
              - listitem [ref=f6e315]:
                - generic [ref=f6e316]: "6"
                - generic [ref=f6e317]: Place reinforcement on chairs so it sits mid-slab.
              - listitem [ref=f6e318]:
                - generic [ref=f6e319]: "7"
                - generic [ref=f6e320]: Re-check dimensions, depth, and slope before the concrete arrives.
              - listitem [ref=f6e321]:
                - generic [ref=f6e322]: "8"
                - generic [ref=f6e323]: Place the concrete and screed it level with the forms.
              - listitem [ref=f6e324]:
                - generic [ref=f6e325]: "9"
                - generic [ref=f6e326]: Float, edge, and finish once the bleed water is gone.
              - listitem [ref=f6e327]:
                - generic [ref=f6e328]: "10"
                - generic [ref=f6e329]: Cure it — keep it damp or covered for several days.
              - listitem [ref=f6e330]:
